<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>PowerToys</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/powertoys.css">
  <script src="js/theme-boot.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="pt-topbar">
    <span class="pt-topbar-title">PowerToys</span>
    <nav class="pt-nav" aria-label="Main">
      <a class="pt-nav-link is-current" href="./" aria-current="page">
        <svg class="pt-nav-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M3 12h18"></path>
          <path d="M12 3c2.5 2.6 4 5.6 4 9s-1.5 6.4-4 9c-2.5-2.6-4-5.6-4-9s1.5-6.4 4-9z"></path>
        </svg>
        <span>Home</span>
      </a>
    </nav>
    <button class="pt-theme-toggle" id="theme-toggle" type="button" aria-pressed="false" aria-label="Toggle dark theme">
      <svg class="pt-theme-icon pt-theme-icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
      </svg>
      <svg class="pt-theme-icon pt-theme-icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2"></path>
        <path d="M12 20v2"></path>
        <path d="M4.9 4.9l1.4 1.4"></path>
        <path d="M17.7 17.7l1.4 1.4"></path>
        <path d="M2 12h2"></path>
        <path d="M20 12h2"></path>
        <path d="M4.9 19.1l1.4-1.4"></path>
        <path d="M17.7 6.3l1.4-1.4"></path>
      </svg>
    </button>
  </header>
  <main class="pt-main">
    <section class="pt-frame" aria-labelledby="wc-title">
      <h2 class="pt-widget-title" id="wc-title">World clock</h2>
      <div id="world-clock"></div>
      <p class="visually-hidden" role="status" aria-live="polite" id="wc-live"></p>
    </section>
    <section class="pt-frame" aria-labelledby="pw-title">
      <h2 class="pt-widget-title" id="pw-title">Picker wheel</h2>
      <div id="picker-wheel"></div>
      <p class="visually-hidden" role="status" aria-live="polite" id="pw-live"></p>
    </section>
    <section class="pt-frame er-frame" aria-label="Endless runner">
      <div id="endless-runner"></div>
      <p class="visually-hidden" role="status" aria-live="polite" id="er-live"></p>
    </section>
  </main>
</body>
</html>
